# DevTeam UX Configuration
# Referenced by: ux/ux-system-coordinator.md
# Defines accessibility standards, platform targets, and design system paths

ux:
  accessibility:
    level: AA  # A, AA, or AAA
    require_audit: true

  platforms:
    primary: web
    secondary: [mobile]

  design_system:
    # Must match the detection locations in task-loop-config.yaml's
    # design_compliance gate and agents/ux/design-compliance-validator.md /
    # design-drift-detector.md -- do not diverge from "design-system/" here,
    # it silently breaks detection for all of them (Architecture Audit Phase 4).
    tokens_path: "design-system/tokens/"
    components_path: "design-system/components/"

  validation:
    check_consistency: true
    check_accessibility: true
    check_drift: true
